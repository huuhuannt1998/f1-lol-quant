name: Update forecasts

on:
  schedule:
    # Hourly at :17 (off the top of the hour, when GitHub's queue is busiest).
    # Hourly keeps the last logged forecast close to each match's start.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forecasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      # Oracle's Elixir (in-game stats) comes from Google Drive. Past years are
      # downloaded once, the current year about daily; after a Drive quota
      # refusal the pipeline waits 24 h and forecasts with what it has.
      F1LOL_OE_DOWNLOAD: "1"
      # The Action is the only writer of the committed ledger (local runs use
      # cache/ledger_local; see pipeline/config.py).
      F1LOL_LEDGER_DIR: ${{ github.workspace }}/ledger
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a "My pick" counts only if its file was committed
          # before the event, and that commit time comes from git log.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Raw downloads (finished F1 seasons, old LoL pages, Oracle's Elixir
      # CSVs) are cached between runs so each run only fetches what is new.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            !cache/oe
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      # The Oracle's Elixir CSVs (~240 MB) get their own cache, saved once a
      # day instead of every hour.
      - name: Day stamp
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Oracle's Elixir files
        uses: actions/cache@v4
        with:
          path: cache/oe
          key: oe-${{ steps.day.outputs.day }}
          restore-keys: oe-

      - name: Fetch, forecast, write data/*.json
        run: python -m pipeline update

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data ledger
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
